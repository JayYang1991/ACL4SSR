[custom]
; 指定 sing-box 基础 JSON 模板地址（Subconverter 会自动载入该 JSON 模板中的 TUN 接口、FakeIP DNS 及 rule-set 规则集）
singbox_rule_base=https://raw.githubusercontent.com/JayYang1991/ACL4SSR/refs/heads/main/sing-box/singbox-template.json

; 策略组定义：参考 config.json 中的 auto-selector-tcp (urltest 自动延迟测试)
custom_proxy_group=auto-selector-tcp`url-test`.*`https://www.gstatic.com/generate_204`180,,50

; 1. 局域网与私有 IP 直连 (参考 ip_is_private: true)
rulesets=direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
rulesets=direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list

; 2. 专属直连域名 (参考 config.json 中的 rules 域名直连)
rulesets=direct,[]DOMAIN,cloudflare.com
rulesets=direct,[]DOMAIN,my.dnshe.com
rulesets=direct,[]DOMAIN,cn.archive.ubuntu.com
rulesets=direct,[]DOMAIN-SUFFIX,aliyun.com
rulesets=direct,[]DOMAIN-SUFFIX,alipay.com
rulesets=direct,[]DOMAIN-SUFFIX,taobao.com
rulesets=direct,[]DOMAIN-SUFFIX,tmall.com
rulesets=direct,[]DOMAIN-SUFFIX,alicdn.com
rulesets=direct,[]DOMAIN-SUFFIX,baidu.com
rulesets=direct,[]DOMAIN-SUFFIX,jd.com

; 3. 走代理规则集 (参考 config.json 中的 geosite/geoip: google, youtube, openai, telegram, discord)
rulesets=auto-selector-tcp,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Google.list
rulesets=auto-selector-tcp,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
rulesets=auto-selector-tcp,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Telegram.list
rulesets=auto-selector-tcp,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list

; 4. 中国大陆域名与 IP 直连 (参考 geosite-cn, geoip-cn)
rulesets=direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
rulesets=direct,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
rulesets=direct,GEOIP,CN

; 5. 兜底规则 (参考 config.json 中的 final: auto-selector-tcp)
rulesets=auto-selector-tcp,MATCH
